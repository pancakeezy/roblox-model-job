# Reruns the job search every hour (at :17) and publishes the page on GitHub Pages.
# If you change the minute here, change --schedule-minute below to match.
name: Update job board

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:      # "Run workflow" button on the Actions tab
  push:
    branches: [main]

permissions:
  contents: write         # to save seen.json (when each job was first found)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Search for jobs
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python job_finder.py --no-open --out site/index.html --schedule-minute 17

      - name: Remember which jobs were already found
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          if [ -f x_cache.json ]; then git add x_cache.json; fi
          git commit -m "Update found jobs" || echo "No new jobs"
          git push || echo "Could not save seen.json this time"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
